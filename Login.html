<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Web</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    }

    section {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100vh;
    }

    .form-box {
      position: relative;
      width: 400px;
      height: 500px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .form-value {
      width: 100%;
      padding: 40px;
    }

    h2 {
      font-size: 2em;
      color: white;
      text-align: center;
      margin-bottom: 30px;
    }

    .inputbox {
      position: relative;
      margin: 30px 0;
      width: 100%;
      border-bottom: 2px solid rgba(255, 255, 255, 0.5);
    }

    .inputbox input {
      width: 100%;
      height: 45px;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 1em;
      padding: 0 5px;
    }

    .inputbox label {
      position: absolute;
      top: 50%;
      left: 5px;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.7);
      font-size: 1em;
      pointer-events: none;
      transition: 0.3s;
    }

    .inputbox input:focus ~ label,
    .inputbox input:valid ~ label {
      top: -5px;
      font-size: 0.8em;
      color: #6c63ff;
    }

    .forget {
      margin: 15px 0;
      text-align: center;
    }

    .forget label p {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.9em;
    }

    .forget a {
      color: #6c63ff;
      text-decoration: none;
    }

    .forget a:hover {
      text-decoration: underline;
    }

    button {
      width: 100%;
      height: 45px;
      border-radius: 40px;
      background: #6c63ff;
      border: none;
      outline: none;
      cursor: pointer;
      font-size: 1em;
      font-weight: 600;
      color: white;
      margin-top: 20px;
      transition: 0.3s;
    }

    button:hover {
      background: #5a52d6;
      transform: scale(1.02);
    }

    .register {
      text-align: center;
      margin-top: 20px;
    }

    .register p {
      color: rgba(255, 255, 255, 0.7);
    }

    .register a {
      color: #6c63ff;
      text-decoration: none;
      font-weight: 600;
    }

    .register a:hover {
      text-decoration: underline;
    }

    .error-msg {
      color: #ff6b6b;
      text-align: center;
      font-size: 0.85em;
      margin-top: 10px;
      display: none;
    }

    @media (max-width: 480px) {
      .form-box {
        width: 90%;
        margin: 0 20px;
      }
    }
  </style>
</head>
<body>
  <section>
    <div class="form-box">
      <div class="form-value">
        <form id="loginForm">
          <h2>Login</h2>
          <div class="inputbox">
            <input type="email" id="emailInput" required>
            <label>Email</label>
          </div>
          <div class="inputbox">
            <input type="password" id="passwordInput" required>
            <label>Password</label>
          </div>
          <div class="forget">
            <label>
              <p>Forget <a href="#">Password</a></p>
            </label>
          </div>
          <button type="submit">Log in</button>
          <div class="register">
            <p>Don't have an account <a href="#">Register</a></p>
          </div>
          <div id="errorMsg" class="error-msg"></div>
        </form>
      </div>
    </div>
  </section>

  <script>
    const loginForm = document.getElementById('loginForm');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const errorMsg = document.getElementById('errorMsg');

    loginForm.addEventListener('submit', function(e) {
      e.preventDefault();
      
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      
      if (!email || !password) {
        errorMsg.style.display = 'block';
        errorMsg.textContent = 'Email dan password harus diisi!';
        return;
      }
      
      // Cek apakah email mengandung @gmail.com
      if (email.includes('@gmail.com')) {
        // Login berhasil, redirect ke lander.html
        window.location.href = 'lander.html';
      } else {
        // Login gagal, anggap salah password bebas
        errorMsg.style.display = 'block';
        errorMsg.textContent = 'Password salah! (Hanya email @gmail.com yang diizinkan)';
        
        // Efek geter dikit
        const formBox = document.querySelector('.form-box');
        formBox.style.transform = 'translateX(5px)';
        setTimeout(() => formBox.style.transform = 'translateX(-5px)', 50);
        setTimeout(() => formBox.style.transform = 'translateX(3px)', 100);
        setTimeout(() => formBox.style.transform = 'translateX(0)', 150);
        
        // Reset password field biar kelihatan kyk gagal login beneran
        passwordInput.value = '';
        passwordInput.focus();
      }
    });
  </script>
</body>
</html>
